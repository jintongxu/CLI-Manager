<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body,
      #root {
        background: #1a1b26;
      }
      :root[data-window="translator"],
      :root[data-window="translator"] body,
      :root[data-window="translator"] #root,
      :root[data-window="translator-capture"],
      :root[data-window="translator-capture"] body,
      :root[data-window="translator-capture"] #root,
      :root[data-window="desktop-pet"],
      :root[data-window="desktop-pet"] body,
      :root[data-window="desktop-pet"] #root {
        background-color: transparent !important;
        background: transparent !important;
      }
    </style>
    <script>
      (function() {
        try {
          var h = window.location.hash;
          if (h === '#translator' || h === '#translator-capture' || h === '#desktop-pet') {
            document.documentElement.dataset.window = h.substring(1);
            document.documentElement.style.background = 'transparent';
          }
        } catch (_) {}
      })();
    </script>
    <title>CLI-Manager</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
