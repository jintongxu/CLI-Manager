<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLI-Manager · Real layout / Graphite</title>
  <link rel="stylesheet" href="real-layout.css">
  <script src="real-layout.js" defer></script>
</head>
<body data-appearance="revised" data-terminal-follow="true">
  <header class="preview-bar" aria-label="Preview controls">
    <strong>GRAPHITE <span data-i18n="preview">真实布局预览</span></strong>
    <span class="mock-badge" data-i18n="mock">静态模拟 · 非真实终端</span>
    <div class="preview-controls">
      <div class="appearance-switch" role="group" aria-label="Appearance">
        <button id="baseline" type="button" aria-pressed="false" data-i18n="baseline">原始外观</button>
        <button id="revised" type="button" aria-pressed="true" data-i18n="revised">Graphite 修正版</button>
      </div>
      <label class="follow-control"><input id="terminal-follow" type="checkbox" checked><span data-i18n="follow">终端跟随外壳</span></label>
      <label class="language-control"><span class="sr-only" data-i18n="language">语言</span><select id="language"><option value="zh-CN">中文</option><option value="en">English</option></select></label>
    </div>
    <span id="preview-note" role="status">仅预览，未修改生产 · 终端：中性炭灰</span>
  </header>
  <section class="app-window" aria-label="CLI-Manager static layout">
    <header class="titlebar"><span class="app-mark">›_</span><strong>CLI-Manager</strong><div class="window-actions" aria-hidden="true"><span>•••</span><span>−</span><span>□</span><span>×</span></div></header>
    <div class="app-layout">
      <aside class="project-sidebar" aria-label="Projects">
        <header class="project-header"><strong data-i18n="projects">项目</strong><span class="project-actions" aria-hidden="true"><span>‹</span><span>⊞</span><span class="new-project" data-i18n="new">+ 新建</span></span></header>
        <div id="project-tree" class="project-tree"></div>
      </aside>
      <main class="workspace">
        <header class="workspace-tabs"><span class="pending" data-i18n="pending">待加入 · 1</span><span class="terminal-tab">test <span aria-hidden="true">×</span></span><span class="terminal-list" data-i18n="terminalList">终端列表 · 1⌄</span></header>
        <section class="terminal" aria-label="PowerShell mock terminal" tabindex="0">
          <div class="terminal-output">
            <div class="prompt"><span class="prompt-corner">╭</span><span class="prompt-segments"><span class="ansi-user">▣ dev</span><span class="ansi-path">▰ D:\workspace\cli-test</span><span class="ansi-branch">⑂ wt/task-preview ≢</span></span><span class="prompt-status"><span class="ansi-ok">✓ OK</span><span class="ansi-time">12:17</span></span><span class="prompt-end">╮</span></div>
            <div class="command"><span class="prompt-arrow">╰➜</span> <span class="ansi-command">docker</span> <span class="ansi-option">--version</span></div>
            <div class="command-output">Docker version 29.7.2, build a7dcaab</div>
            <div class="prompt"><span class="prompt-corner">╭</span><span class="prompt-segments"><span class="ansi-user">▣ dev</span><span class="ansi-path">▰ D:\workspace\cli-test</span><span class="ansi-branch">⑂ wt/task-preview ≢</span></span><span class="prompt-status"><span class="ansi-ok">✓ OK</span><span class="ansi-time">12:17</span></span><span class="prompt-end">╮</span></div>
            <div class="command"><span class="prompt-arrow">╰➜</span> <span class="caret" aria-hidden="true"></span></div>
          </div>
        </section>
      </main>
      <aside id="icon-rail" class="icon-rail" aria-label="Static tool rail"></aside>
    </div>
  </section>
</body>
</html>
