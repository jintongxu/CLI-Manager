name: Windows Release

on:
  push:
    tags:
      - "V*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        default: V1.4.6
        type: string
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: false
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Validate release workflow
        run: node .github/scripts/release-workflow.test.mjs

      - name: Build and publish Windows installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: CLI-Manager ${{ inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis,msi

      - name: Package Windows portable ZIP
        shell: pwsh
        run: .\scripts\package-portable.ps1 -Version "${{ inputs.tag || github.ref_name }}" -SourceDir "src-tauri/target/release" -OutputDir "dist/portable"

      - name: Upload Windows portable ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/portable/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
