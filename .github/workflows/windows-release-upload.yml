name: Windows Release (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        default: V1.4.5
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
